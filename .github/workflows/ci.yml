#
# Format, lints, tests, every feature on its own, licences and advisories,
# and a short fuzzing smoke run. The tests use the committed samples in
# tests/data; reference rows of files under tests/reference (downloaded
# locally, not committed) are skipped.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-features --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --all-features

  features:
    # Every feature must build alone. Shared helpers are unused in most
    # single-format builds, so only dead code is allowed.
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings -A dead_code
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - run: cargo hack check --each-feature --lib

  deny:
    # Licence allowlist (deny.toml, all features), advisories, sources.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  fuzz:
    # One minute per target from the seed corpus; longer runs are local
    # (see fuzz/README.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - run: python3 -I fuzz/seed.py
      - name: Run targets
        working-directory: fuzz
        # cargo-fuzz needs nightly, which the toolchain step does not make
        # the default. Every target runs; the step fails if any of them
        # crashed (panic, sanitizer error). Inputs that only exceed the time or memory limit
        # (bounded but large decodes claimed by corrupt headers, slow under
        # the sanitizer) are kept as artifacts without failing the run.
        run: |
          failed=""
          for t in $(cargo +nightly fuzz list); do
            echo "::group::$t"
            cargo +nightly fuzz run -O "$t" "corpus/$t" -- -fork=1 -ignore_timeouts=1 -ignore_ooms=1 -max_total_time=60 -timeout=30 -rss_limit_mb=3072 -malloc_limit_mb=2200 -max_len=1048576 || failed="$failed $t"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::fuzz targets with crashes:$failed"; exit 1; fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --release --all-features --summary-only
