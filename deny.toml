# cargo-deny configuration: only licences that allow licensing scopeio
# commercially; every feature is checked.
[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
]
confidence-threshold = 0.9

# scopeio itself is AGPL-3.0-only with an exception; only dependencies are
# restricted.
[[licenses.exceptions]]
allow = ["AGPL-3.0-only"]
crate = "scopeio"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
